<!--
  New Tab 頁面結構。
  包含一個載入動畫容器和一個嵌入的 iframe。
-->
<!DOCTYPE html>
<html>
  <head>
    <title>New Tab</title>
    <style>
      html,
      body,
      iframe {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        border: none;
        overflow: hidden;
      }
      /* 載入動畫容器樣式 */
      .loading-container {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        background-color: #a78bfa;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
      }
      .loading-container.hidden {
        display: none;
      }
      .loading-container img {
        width: 32px;
        height: 32px;
      }
    </style>
  </head>

  <body>
    <!-- 載入動畫容器：在 iframe 內容準備好之前顯示 -->
    <div class="loading-container" id="loading">
      <img src="/icons/favicon-32x32.png" alt="loading logo" />
    </div>

    <!-- 嵌入外部應用程式的 iframe -->
    <!-- frameborder="0"：移除 iframe 的邊框 -->
    <iframe
      src="https://hotnow.garylin.dev"
      frameborder="0"
    ></iframe>

    <!-- 載入邏輯腳本 -->
    <script src="script.js"></script>
  </body>
</html>
